version: "3"
virtualmachines:
  - name: kafka
    image: docker
    shell: /bin/bash
    machine_type: n1-standard-2
    allow_external_ingress:
      - high-ports
    provision_ssl_certificate: true
secrets:
  - name: ASP_URI
  - name: ATLAS_URI
  - name: ASP_PLAYGROUND_REF
  - name: ATLAS_KAFKA_ALLOWED_CIDRS
